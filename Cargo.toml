[workspace]
resolver = "2"
members = [
  "crates/honba-kokoro",
  "crates/honba-kokoro-oms",
  "crates/honba-kokoro-portfolio",
  "crates/honba-kokoro-ledger",
]
exclude = ["benches"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0"
repository = "https://github.com/your-org/honba-kokoro"

[workspace.dependencies]
honba-core = { path = "../honba-core" }
honba-kokoro = { path = "crates/honba-kokoro" }
honba-kokoro-oms = { path = "crates/honba-kokoro-oms" }
honba-kokoro-portfolio = { path = "crates/honba-kokoro-portfolio" }
honba-kokoro-ledger = { path = "crates/honba-kokoro-ledger" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rust_decimal = "1"
async-trait = "0.1"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
axum = "0.7"
clap = { version = "4", features = ["derive"] }
hyper = "1"
proptest = "1.12"
divan = "0.1"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.prod]
inherits = "release"
lto = true
codegen-units = 1
