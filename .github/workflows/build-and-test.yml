name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - crate: honba-kokoro-oms
          - crate: honba-kokoro-portfolio
          - crate: honba-mon

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust toolchain setup
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Cache Cargo registry
        uses: actions/cache@v3
        with:
          path: /root/.cargo/registry
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache Cargo lock
        uses: actions/cache@v3
        with:
          path: /home/runner/honba-kokoro/Cargo.lock
          key: cargo-lock-${{ runner.os }}-${{ hashFiles('**/Cargo.toml') }}

      - name: Build crate
        run: cargo build --release -p ${{ matrix.crate }}

      - name: Run tests
        run: cargo test --release -p ${{ matrix.crate }}

  # Phase 7: Deployment job (runs after build/test succeeds)
  deploy:
    needs: build-test
    name: Deploy
    runs-on: ubuntu-latest
    if: matrix.crate == 'honba-kokoro-portfolio' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t honba-kokoro-portfolio:${{ github.sha }} \
            -f Dockerfile.dev .

      - name: Push Docker image
        env:
          REGISTRY_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "${REGISTRY_PASSWORD}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker push honba-kokoro-portfolio:${{ github.sha }}

  # Phase 7: Health check job
  health-check:
    needs: build-test
    name: Health Check
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check crate compilation
        run: |
          cargo check -p honba-kokoro-oms
          cargo check -p honba-kokoro-portfolio
          cargo check -p honba-mon